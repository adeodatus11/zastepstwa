name: Sprawdź i przygotuj serwis
on:
  push:
    branches: [przebudowa]
  pull_request:
    branches: [przebudowa]
  workflow_dispatch:
    inputs:
      publish:
        description: "Opublikuj odebraną wersję na GitHub Pages"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r requirements-build.txt
      - run: python scripts/privacy_xlsx.py
      - run: npm run check
      - run: npm run verify
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-testow
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: podglad-serwisu
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.PUBLISH_PRZEBUDOWA == 'true')
        with:
          path: dist/
  deploy:
    if: github.ref == 'refs/heads/przebudowa' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.PUBLISH_PRZEBUDOWA == 'true'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  plan-uczniowski:
    # Plan uczniowski w osobnym repozytorium: po udanym wdrożeniu serwisu
    # nauczyciela przebudowuje student-changes.json z tych samych plików.
    needs: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: plan-uczniowski
      cancel-in-progress: false
    env:
      PLAN_REPO_TOKEN: ${{ secrets.PLAN_REPO_TOKEN }}
    steps:
      - name: Sprawdź dostęp do repozytorium planu
        if: env.PLAN_REPO_TOKEN == ''
        run: |
          echo "::error::Brak sekretu PLAN_REPO_TOKEN — plan.szkolamistrzow.info nie został zaktualizowany. Instrukcja: INSTRUKCJA_AKTUALIZACJI_ZASTEPSTW.md, sekcja o stronie aktualizacji."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: adeodatus11/plan-4-maja-2026
          ref: main
          path: plan
          token: ${{ secrets.PLAN_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - run: npm install --prefix "$RUNNER_TEMP/jsdom" --no-save --no-package-lock jsdom@26.1.0
      - name: Zbuduj, sprawdź i wypchnij nakładkę zmian
        env:
          NODE_PATH: ${{ runner.temp }}/jsdom/node_modules
        run: |
          git -C plan config user.name "github-actions[bot]"
          git -C plan config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            scripts/plan_uczniowski.sh
            if git -C plan diff --quiet -- student-changes.json; then
              echo "Plan uczniowski już aktualny."
              exit 0
            fi
            git -C plan commit -m "Aktualizacja zastępstw z serwisu nauczyciela" -m "Źródło: ${{ github.repository }}@${{ github.sha }}" -- student-changes.json
            git -C plan push origin HEAD:main && exit 0
            git -C plan fetch origin main
            git -C plan reset --hard origin/main
          done
          echo "::error::Nie udało się wypchnąć planu uczniowskiego po 3 próbach."
          exit 1
